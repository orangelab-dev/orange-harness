[project]
name = "orange-harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.3.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
]

[project.scripts]
orange-harness = "orange_harness.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
